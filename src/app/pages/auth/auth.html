<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow p-8 w-full max-w-md border border-gray-100">

    <h1 class="text-2xl font-bold text-gray-900 mb-2 text-center">
      {{ mode === 'login' ? 'Connexion' : 'Inscription' }}
    </h1>
    <p class="text-center text-gray-500 text-sm mb-6">
      {{ mode === 'login' ? 'Accédez à votre espace organisateur' : 'Créez votre compte organisateur' }}
    </p>

    <form (ngSubmit)="onSubmit()">

      <div *ngIf="mode === 'register'" class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Prénom</label>
        <input type="text" [(ngModel)]="form.firstName" name="firstName" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div *ngIf="mode === 'register'" class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
        <input type="text" [(ngModel)]="form.lastName" name="lastName" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" [(ngModel)]="form.email" name="email" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input type="password" [(ngModel)]="form.password" name="password" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div *ngIf="errorMessage"
           class="mb-4 bg-red-50 text-red-700 rounded-lg p-3 text-sm">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="submitting"
              class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition disabled:opacity-50">
        {{ submitting ? 'Chargement...' : (mode === 'login' ? 'Se connecter' : "S'inscrire") }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      {{ mode === 'login' ? 'Pas encore de compte ?' : 'Déjà un compte ?' }}
      <button (click)="toggleMode()" class="text-indigo-600 hover:underline font-medium">
        {{ mode === 'login' ? "S'inscrire" : 'Se connecter' }}
      </button>
    </p>

    <p class="text-center mt-4">
      <a routerLink="/" class="text-gray-400 hover:text-gray-600 text-sm">← Retour aux événements</a>
    </p>

  </div>
</div>
