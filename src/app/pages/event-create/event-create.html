<div class="min-h-screen bg-gray-50 py-8 px-4">
  <div class="max-w-xl mx-auto">

    <a routerLink="/" class="text-indigo-600 hover:underline text-sm mb-6 inline-block">← Retour</a>

    <div class="bg-white rounded-2xl shadow p-6 border border-gray-100">
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Créer un événement</h1>

      <form (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Titre *</label>
          <input type="text" [(ngModel)]="form.title" name="title" required maxlength="100"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea [(ngModel)]="form.description" name="description" rows="3"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
          <input type="datetime-local" [(ngModel)]="form.date" name="date" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Lieu *</label>
          <input type="text" [(ngModel)]="form.location" name="location" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Capacité *</label>
          <input type="number" [(ngModel)]="form.capacity" name="capacity" required min="1"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div *ngIf="errorMessage"
             class="mb-4 bg-red-50 text-red-700 rounded-lg p-3 text-sm">
          {{ errorMessage }}
        </div>

        <button type="submit" [disabled]="submitting"
                class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition disabled:opacity-50">
          {{ submitting ? 'Création...' : 'Créer l\'événement' }}
        </button>
      </form>
    </div>

  </div>
</div>
